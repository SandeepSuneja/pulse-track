name: pulse_track_mobile
description: Pulse Track mobile client — board, activities, goals, and analytics.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  go_router: ^17.5.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/pulse_track_logo.png
    - assets/images/pulse_track_mark.png
    - assets/images/google_g.png
